name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="quickwit-mcp_${GITHUB_REF_NAME}_${os}_${arch}"
              mkdir "$name"
              binary=quickwit-mcp
              if [ "$os" = windows ]; then binary=quickwit-mcp.exe; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/pakornv/quickwit-mcp/internal/quickwitmcp.version=$GITHUB_REF_NAME" \
                -o "$name/$binary" ./cmd/quickwit-mcp
              cp README.md LICENSE "$name/"
              if [ "$os" = windows ]; then
                zip -qr "dist/$name.zip" "$name"
              else
                tar -czf "dist/$name.tar.gz" "$name"
              fi
              rm -rf "$name"
            done
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
